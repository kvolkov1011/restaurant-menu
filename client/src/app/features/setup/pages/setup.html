@if (isWide()) {
  <app-categories class="panel" />

  <app-menu-items class="panel" />
} @else {
  <mat-tab-group class="section-tabs">
    <mat-tab label="Categories">
      <app-categories [showHeading]="false" />
    </mat-tab>

    <mat-tab label="Menu items">
      <app-menu-items [showHeading]="false" />
    </mat-tab>
  </mat-tab-group>
}
